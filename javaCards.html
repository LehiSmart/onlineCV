<html>
  <head>
    <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Lehi Smart | Computer Science Student</title>
        <meta name="description" content="Computer Science student at Aberystwyth University sharing my interests in software engineering, web development, and building practical projects.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        
  </head>
  <body class="bg-zinc-700 text-white">
    <header class="bg-zinc-800 text-white sticky top-0 z-10">
        <div class="container flex justify-between items-center py-4">
            <a href="index.html" class="text-2xl font-bold">Lehi <strong class="text-emerald-600">Smart</strong></a>

            <ul class="flex items-center gap-4">
                <li><a href="index.html" class="nav-link">Back to Home</a></li>
            </ul>
        </div>
    </header>
    <a href="index.html" class="eyebrow"></a>
    <main id="home" class="container py-8">
      <section class="section-card">
        <div>
          <div class="slideshow-container">
            <div class="mySlides fade">
              <div class="numbertext">1 / 7</div>
              <img src="images/cardgameSnippet.PNG" alt="Card game showcase image" class="project-image" />
              <div class="text">Main Menu</div>
            </div>

            <div class="mySlides fade">
              <div class="numbertext">2 / 7</div>
              <img src="images/cardGameNewGame.PNG" style="width:100%">
              <div class="text">New Game</div>
            </div>

            <div class="mySlides fade">
              <div class="numbertext">3 / 7</div>
              <img src="images/cardAppearsSnip.PNG" style="width:100%">
              <div class="text"><strong>Card Appearances</strong></div>
            </div>

            <div class="mySlides fade">
              <div class="numbertext">4 / 7</div>
              <img src="images/newCards.PNG" style="width:100%">
              <div class="text"><strong>Custom Cards</strong></div>
            </div>
            
            <div class="mySlides fade">
              <div class="numbertext">5 / 7</div>
              <img src="images/newJoker.PNG" style="width:100%">
              <div class="text"><strong>Custom Joker</strong></div>
            </div>

            <div class="mySlides fade">
              <div class="numbertext">6 / 7</div>
              <img src="images/drawCards.PNG" style="width:100%">
              <div class="text"><strong>Draw Cards</strong></div>
            </div>

            <div class="mySlides fade">
              <div class="numbertext">7 / 7</div>
              <img src="images/settings.PNG" style="width:100%">
              <div class="text"><strong>Settings</strong></div>
            </div>

            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
          </div>
          <br><!-- The dots/circles -->
          <div style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
            <span class="dot" onclick="currentSlide(6)"></span>
            <span class="dot" onclick="currentSlide(7)"></span>
          </div>
          <h1><strong>Java Card Game</strong></h1>
          <p>A card game developed with Java and built with Maven. Fully functional with great features.</p>
        </div>
      </section>
    </main>
    <footer class="container py-6 text-center text-sm text-gray-300">
            © 2026 Lehi Smart
    </footer>
  </body>
  <script src="slides.js"></script>
</html>
